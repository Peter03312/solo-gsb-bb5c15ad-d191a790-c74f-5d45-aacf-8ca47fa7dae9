<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回收分拣来料污染判定</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f4f6f8; color: #222; }
  header { background: #1f6f4a; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  main { max-width: 1080px; margin: 20px auto; padding: 0 16px; display: grid;
         grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px 18px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 12px; font-size: 15px; color: #1f6f4a; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
  input, select { width: 100%; padding: 7px 9px; border: 1px solid #ccd;
                  border-radius: 5px; font-size: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mat-row { display: grid; grid-template-columns: 1fr 120px 32px; gap: 8px;
             margin-bottom: 6px; }
  button { background: #1f6f4a; color: #fff; border: 0; border-radius: 5px;
           padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button.ghost { background: #e8f0ec; color: #1f6f4a; }
  button.del { background: #f3e6e6; color: #a33; padding: 0; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .errors { background: #fdf0f0; border: 1px solid #e5b8b8; border-radius: 6px;
            padding: 10px 12px; margin-top: 12px; font-size: 13px; color: #a33;
            display: none; }
  .errors li { margin: 3px 0; }
  .notice { background: #fdf6e3; border: 1px solid #e5d8a8; border-radius: 6px;
            padding: 10px 12px; margin-top: 12px; font-size: 13px; color: #8a6d00; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px;
           font-size: 13px; font-weight: 600; }
  .lv-A { background: #e2f4e8; color: #1f6f4a; }
  .lv-B { background: #fdf3d8; color: #9a6b00; }
  .lv-C { background: #fbe3e3; color: #a33; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; }
  td.num, th.num { text-align: right; }
  .evidence { font-size: 13px; color: #444; padding-left: 18px; }
  .evidence li { margin: 3px 0; }
  .muted { color: #888; font-size: 12px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f6faf8; }
  tr.current-rev { background: #eef6f1; }
  .links a { margin-right: 12px; font-size: 13px; color: #1f6f4a; }
  .rev-link { color: #1f6f4a; cursor: pointer; font-size: 13px; }
  #result { display: none; }
</style>
</head>
<body>
<header>
  <h1>回收分拣来料污染判定</h1>
  <div class="sub">提交批次检验数据，按启用规则版本出具污染等级、处置结论与扣费明细；录入有误时可凭原单号提交修订</div>
</header>
<main>
  <section class="card">
    <h2>新建判定</h2>
    <div class="row">
      <div><label>批次编号 *</label><input id="batch_no" placeholder="如 B20261005-001"></div>
      <div><label>来源区域 *</label><select id="region"></select></div>
    </div>
    <div class="row">
      <div><label>批次重量 (kg) *</label><input id="weight_kg" type="number" min="0" step="any" placeholder="如 100"></div>
      <div><label>操作员</label><input id="operator" placeholder="可选"></div>
    </div>
    <label>检验物料（类别 / 污染量 kg）</label>
    <div id="materials"></div>
    <button class="ghost" type="button" onclick="addMatRow()">+ 添加物料</button>
    <div class="actions">
      <button id="submitBtn" onclick="submitForm()">提交判定</button>
      <span class="muted" id="ruleHint"></span>
    </div>
    <div class="errors" id="errors"></div>
  </section>

  <section class="card" id="result">
    <h2>判定结果</h2>
    <div id="resultBody"></div>
  </section>

  <section class="card">
    <h2>修订判定单</h2>
    <div class="row">
      <div><label>判定单号（须为当前最新版本）*</label><input id="rev_id" placeholder="如 A0F9F9D8876"></div>
      <div><label>操作员 *</label><input id="rev_operator" placeholder="修订操作者"></div>
    </div>
    <label>修正原因 *</label>
    <input id="rev_reason" placeholder="如：地磅校准偏差，复称修正">
    <div class="row">
      <div><label>复检重量 (kg) *</label><input id="rev_weight" type="number" min="0" step="any"></div>
      <div><label>&nbsp;</label><button class="ghost" type="button" onclick="fillRevision(document.getElementById('rev_id').value.trim())">读取该单数据</button></div>
    </div>
    <label>复检物料（类别 / 污染量 kg）</label>
    <div id="rev_materials"></div>
    <button class="ghost" type="button" onclick="addRevMatRow()">+ 添加物料</button>
    <div class="actions">
      <button id="revBtn" onclick="submitRevision()">提交修订</button>
      <span class="muted" id="revHint"></span>
    </div>
    <div class="errors" id="rev_errors"></div>
  </section>

  <section class="card full">
    <h2>最近判定单
      <span class="links" style="float:right">
        <a href="/api/export/assessments.csv">导出判定单 CSV</a>
        <a href="/api/export/audit.csv">导出审计记录 CSV</a>
        <a href="/docs" target="_blank">API 文档</a>
      </span>
    </h2>
    <table>
      <thead><tr>
        <th>判定单号</th><th>批次编号</th><th>区域</th><th class="num">重量 kg</th>
        <th class="num">污染率</th><th>等级</th><th>结论</th>
        <th class="num">扣费</th><th>版本</th><th>规则版本</th><th>时间</th><th>操作</th>
      </tr></thead>
      <tbody id="recent"></tbody>
    </table>
  </section>
</main>

<script>
let RULES = {};      // region -> 当前启用规则
let ALL_RULES = {};  // "region/version" -> 规则（含历史版本，用于修订时取快照类别）
let REV_KEY = null;  // 修订表单当前对应判定单的 "region/rule_version"

async function loadRules() {
  const res = await fetch('/api/rules');
  const data = await res.json();
  RULES = {}; ALL_RULES = {};
  for (const item of data.rules) {
    ALL_RULES[`${item.region}/${item.version}`] = item.rule;
    if (item.status === 'active') RULES[item.region] = item.rule;
  }
  const sel = document.getElementById('region');
  sel.innerHTML = '';
  for (const region of Object.keys(RULES)) {
    const opt = document.createElement('option');
    opt.value = region;
    opt.textContent = `${region}（${RULES[region].version}）`;
    sel.appendChild(opt);
  }
  updateRuleHint();
  document.getElementById('materials').innerHTML = '';
  addMatRow();
}

function updateRuleHint() {
  const rule = RULES[document.getElementById('region').value];
  document.getElementById('ruleHint').textContent =
    rule ? `当前启用规则版本：${rule.version}` : '';
}

function matRowHtml(cats, cat, cont) {
  return `<select class="cat">${cats.map(c =>
      `<option ${c === cat ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <input class="cont" type="number" min="0" step="any" placeholder="污染量 kg"
      ${cont != null ? `value="${cont}"` : ''}>
    <button class="del" type="button" onclick="this.parentElement.remove()">×</button>`;
}

function addMatRow() {
  const rule = RULES[document.getElementById('region').value];
  const div = document.createElement('div');
  div.className = 'mat-row';
  div.innerHTML = matRowHtml(rule ? Object.keys(rule.categories) : []);
  document.getElementById('materials').appendChild(div);
}

function addRevMatRow(cat, cont) {
  const rule = ALL_RULES[REV_KEY] || RULES[document.getElementById('region').value];
  const div = document.createElement('div');
  div.className = 'mat-row';
  div.innerHTML = matRowHtml(rule ? Object.keys(rule.categories) : [], cat, cont);
  document.getElementById('rev_materials').appendChild(div);
}

function showErrors(errors) {
  const box = document.getElementById('errors');
  box.style.display = 'block';
  box.innerHTML = '<b>提交被拒绝：</b><ul>' +
    errors.map(e => `<li><code>${e.field}</code>：${e.message}</li>`).join('') +
    '</ul>';
}

function showRevErrors(errors) {
  const box = document.getElementById('rev_errors');
  box.style.display = 'block';
  box.innerHTML = '<b>修订被拒绝：</b><ul>' +
    errors.map(e => `<li><code>${e.field}</code>：${e.message}</li>`).join('') +
    '</ul>';
}

function collectMaterials(sel) {
  return [...document.querySelectorAll(sel)].map(r => ({
    category: r.querySelector('.cat').value,
    contamination_kg: parseFloat(r.querySelector('.cont').value),
  })).filter(m => m.category && !isNaN(m.contamination_kg));
}

async function submitForm() {
  document.getElementById('errors').style.display = 'none';
  const body = {
    batch_no: document.getElementById('batch_no').value.trim(),
    region: document.getElementById('region').value,
    weight_kg: parseFloat(document.getElementById('weight_kg').value),
    materials: collectMaterials('#materials .mat-row'),
  };
  const op = document.getElementById('operator').value.trim();
  if (op) body.operator = op;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/assessments', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) { showErrors(data.errors || [{field: '-', message: res.status}]); return; }
    await renderResult(data);
    loadRecent();
  } finally {
    btn.disabled = false;
  }
}

async function fillRevision(id) {
  if (!id) { showRevErrors([{field: 'id', message: '请先输入判定单号'}]); return; }
  const res = await fetch(`/api/assessments/${id}/revisions`);
  const data = await res.json();
  if (!res.ok) { showRevErrors(data.errors || [{field: '-', message: res.status}]); return; }
  // 始终基于链尾（当前有效版本）填写，避免提交后被判为冲突
  const cur = data.current;
  document.getElementById('rev_id').value = cur.id;
  document.getElementById('rev_weight').value = cur.weight_kg;
  REV_KEY = `${cur.region}/${cur.rule_version}`;
  document.getElementById('revHint').textContent =
    `沿用 ${cur.region}/${cur.rule_version} 规则快照复算（批次 ${cur.batch_no}）`;
  const box = document.getElementById('rev_materials');
  box.innerHTML = '';
  for (const m of cur.materials) addRevMatRow(m.category, m.contamination_kg);
  document.getElementById('rev_errors').style.display = 'none';
  document.getElementById('rev_reason').focus();
}

async function submitRevision() {
  document.getElementById('rev_errors').style.display = 'none';
  const aid = document.getElementById('rev_id').value.trim();
  const body = {
    reason: document.getElementById('rev_reason').value.trim(),
    operator: document.getElementById('rev_operator').value.trim(),
    weight_kg: parseFloat(document.getElementById('rev_weight').value),
    materials: collectMaterials('#rev_materials .mat-row'),
  };
  const btn = document.getElementById('revBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`/api/assessments/${aid}/revisions`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) { showRevErrors(data.errors || [{field: '-', message: res.status}]); return; }
    await renderResult(data);
    loadRecent();
  } finally {
    btn.disabled = false;
  }
}

async function renderResult(d) {
  document.getElementById('result').style.display = 'block';
  const pct = (d.contamination_ratio * 100).toFixed(2) + '%';
  let html = `
    <p>
      <span class="badge lv-${d.level.code}">${d.level.code} · ${d.level.name}</span>
      <b style="margin-left:8px">${d.conclusion}</b>
      <span class="muted" style="margin-left:8px">版本 v${d.revision_no}${d.superseded ? '（已被修订）' : '（当前有效）'}</span>
    </p>
    <table>
      <tr><th>判定单号</th><td>${d.id}</td><th>批次</th><td>${d.batch_no}</td></tr>
      <tr><th>规则版本</th><td>${d.region}/${d.rule_version}</td>
          <th>污染率</th><td>${pct}（${d.total_contamination_kg}kg / ${d.weight_kg}kg）</td></tr>
      ${d.revision_reason ? `<tr><th>修正原因</th><td>${d.revision_reason}</td>
          <th>操作员</th><td>${d.operator || '-'}</td></tr>` : ''}
    </table>
    <h2 style="margin-top:14px">扣费明细（合计 ${d.total_fee.toFixed(2)} ${d.currency}）</h2>
    <table>
      <thead><tr><th>类别</th><th class="num">污染量 kg</th><th class="num">费率</th>
        <th class="num">系数</th><th class="num">扣费</th></tr></thead>
      <tbody>${d.fee_lines.map(l => `<tr><td>${l.category}</td>
        <td class="num">${l.contamination_kg}</td><td class="num">${l.fee_per_kg}</td>
        <td class="num">${l.multiplier}</td><td class="num">${l.fee.toFixed(2)}</td></tr>`).join('')}
      </tbody>
    </table>
    <h2 style="margin-top:14px">证据说明</h2>
    <ul class="evidence">${d.evidence.map(e => `<li>${e}</li>`).join('')}</ul>`;

  // 修订链：链尾结论与历史版本
  const res = await fetch(`/api/assessments/${d.id}/revisions`);
  if (res.ok) {
    const chain = await res.json();
    if (d.superseded) {
      html += `<div class="notice">该版本已被修订取代，
        <a class="rev-link" onclick="showDetail('${chain.current.id}')">查看当前有效版本 v${chain.current.revision_no}</a>。</div>`;
    }
    html += `<h2 style="margin-top:14px">修订链（共 ${chain.revisions.length} 版）</h2>
      <table>
        <thead><tr><th>版本</th><th>判定单号</th><th>结论</th>
          <th class="num">扣费</th><th>操作员</th><th>修正原因</th><th>状态</th></tr></thead>
        <tbody>${chain.revisions.map(r => `
          <tr class="${r.id === d.id ? 'current-rev' : ''}">
            <td>v${r.revision_no}</td>
            <td><a class="rev-link" onclick="showDetail('${r.id}')">${r.id}</a></td>
            <td>${r.conclusion}</td><td class="num">${r.total_fee.toFixed(2)}</td>
            <td>${r.operator || '-'}</td><td>${r.revision_reason || '-'}</td>
            <td>${r.superseded ? '<span class="muted">已被修订</span>' : '<b>当前有效</b>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    html += `<div class="actions">
        <button class="ghost" onclick="fillRevision('${d.id}')">修订此判定单</button>
      </div>`;
  }
  document.getElementById('resultBody').innerHTML = html;
}

async function loadRecent() {
  const res = await fetch('/api/assessments?limit=20');
  const data = await res.json();
  document.getElementById('recent').innerHTML = data.items.map(r => `
    <tr class="clickable" onclick="showDetail('${r.id}')">
      <td>${r.id}</td><td>${r.batch_no}</td><td>${r.region}</td>
      <td class="num">${r.weight_kg}</td>
      <td class="num">${(r.contamination_ratio * 100).toFixed(2)}%</td>
      <td><span class="badge lv-${r.level_code}">${r.level_code}</span></td>
      <td>${r.conclusion}</td><td class="num">${r.total_fee.toFixed(2)}</td>
      <td>v${r.revision_no}${r.superseded ? ' <span class="muted">已修订</span>' : ''}</td>
      <td>${r.rule_version}</td><td class="muted">${r.created_at}</td>
      <td><a class="rev-link" onclick="event.stopPropagation();fillRevision('${r.id}')">修订</a></td>
    </tr>`).join('');
}

async function showDetail(id) {
  const res = await fetch('/api/assessments/' + id);
  if (res.ok) {
    await renderResult(await res.json());
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

document.getElementById('region').addEventListener('change', () => {
  updateRuleHint();
  document.getElementById('materials').innerHTML = '';
  addMatRow();
});
loadRules().then(loadRecent);
</script>
</body>
</html>
